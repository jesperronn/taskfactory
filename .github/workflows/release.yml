name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # Same pin as ci.yml (bin/lint's mdsmith needs Go >= 1.25.11).
          go-version: '1.25.11'

      - name: Verify tag
        run: bin/release-publish --verify-tag "${GITHUB_REF_NAME}"

      - name: Run tests
        run: bin/test

      - name: Run lint
        run: bin/lint

      - name: Package
        run: bin/package "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/dist"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/release-publish "${GITHUB_REF_NAME}" "${RUNNER_TEMP}/dist"

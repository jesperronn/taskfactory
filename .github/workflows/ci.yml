name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          # Pinned mdsmith (bin/lint) requires Go >= 1.25.11; go.mod keeps its lower minimum.
          go-version: '1.25.11'

      - name: Run tests
        run: bin/test

      - name: Build binary
        run: bin/build

      - name: Run lint
        run: bin/lint
